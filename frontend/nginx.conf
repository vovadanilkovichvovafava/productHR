# Канонический домен — enceladus.site. Старый адрес saturn.ac ведёт в ТОТ ЖЕ
# контейнер (два имени у одного nginx), поэтому «перенаправление домена» — это
# правило по Host, а не настройка DNS. 1 = запрос пришёл на старое имя.
map $host $is_legacy_host {
    default                     0;
    enceladus-7oylzk.saturn.ac  1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # За Cloudflare nginx видит http и в редиректах (напр. /miniapp -> /miniapp/)
    # подставлял бы http://, а Telegram открывает Mini App только по https.
    # Относительный редирект убирает схему из ответа вовсе.
    absolute_redirect off;

    # CSV/файловый импорт: дефолтный лимит nginx (1MB) резал загрузки >1MB
    # на 413 ещё до бэкенда. Кандидатские выгрузки бывают крупнее; пакетная
    # заливка шлёт файлы батчами (клиент режет по ~40MB), но одиночный крупный
    # файл (напр. _ALL_candidates.csv) должен пролезать — потому 100M.
    client_max_body_size 100M;

    # API proxy to backend.
    # РЕДИРЕКТА ЗДЕСЬ НЕТ И БЫТЬ НЕ ДОЛЖНО. Расширение («Волшебная кнопка»)
    # у уже установленных рекрутёров ходит на saturn.ac/api, а при кросс-доменном
    # редиректе браузер выбрасывает заголовок Authorization (запрос приедет без
    # токена → 401) и превращает POST в GET (кандидат просто не сохранится) —
    # причём молча, «ошибкой сети». Старый адрес API держим живым, пока у людей
    # стоят старые копии расширения.
    # На Saturn нет внутреннего DNS-имени "backend" → раньше nginx падал на
    # старте ([emerg] host not found in upstream "backend:8000"). Решение:
    #  - resolver + переменная в proxy_pass → DNS резолвится в рантайме, а не
    #    при загрузке конфига, поэтому nginx стартует даже если бэк ещё не
    #    поднялся;
    #  - проксируем на ПУБЛИЧНЫЙ URL бэкенда (гарантированно резолвится),
    #    что убирает зависимость от внутренней сети платформы.
    location /api {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        set $backend_host enceladus-ns9s2o.saturn.ac;
        proxy_pass https://$backend_host$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket (realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Хэшированные ассеты (имя содержит хэш сборки, напр. index-BvBiNnjj.js) —
    # кэшируем на год + immutable. При новом деплое имя файла меняется, поэтому
    # старый кэш безопасен и никогда не «прилипает».
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html — НИКОГДА не кэшируем: браузер всегда ревалидирует и сразу
    # подхватывает новый деплой (новый хэш бандла) БЕЗ ручного Ctrl+Shift+R.
    # Это убирает многолетнюю боль «после деплоя ничего не поменялось».
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Telegram Mini App — отдельное приложение в подкаталоге. Свой fallback
    # обязателен: иначе внутренние роуты мини-аппа проваливались бы в блок ниже
    # и Telegram показывал бы главную страницу сайта вместо приложения.
    # Ассеты мини-аппа хэшированы (miniapp-CikE_6v3.js) — кэшируем на год.
    location /miniapp/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML мини-аппа — НИКОГДА не кэшируем. Без этого заголовка Telegram
    # применяет эвристическое кэширование и показывает страницу, полученную
    # при первом открытии. Именно так вебвью залипал на главной странице
    # сайта, отданной SPA-фолбэком до того, как мини-апп был раскатан.
    location = /miniapp/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Telegram Mini App тоже БЕЗ редиректа: адрес приложения прописан в BotFather,
    # и увод вебвью на другой домен ломает домен, которому Telegram доверяет
    # initData. Перевесим вместе со сменой адреса в BotFather.
    location /miniapp/ {
        try_files $uri $uri/ /miniapp/index.html;
    }

    # SPA routing - all routes go to index.html
    location / {
        # Старое имя → канон, с сохранением пути и query. Редирект стоит ТОЛЬКО
        # здесь, на «человеческих» страницах: /api и /miniapp намеренно живут на
        # обоих доменах (см. комментарии у их location).
        # 302, а не 301: постоянный редирект браузеры кэшируют намертво, а этот
        # домен за сентябрь уже переключали туда-обратно (петля DNS 10.09).
        # Отстоится — можно повысить до 301.
        if ($is_legacy_host) {
            return 302 https://enceladus.site$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
